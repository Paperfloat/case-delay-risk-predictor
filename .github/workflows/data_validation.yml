name: Data & Schema Validation CI

on:
  push:
    branches: [ main, model-training ]
  pull_request:
    branches: [ main ]

jobs:
  validate-data:
    name: validate-${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: delhi-2012
            pull: data/processed/cases_2012_delhi_features.csv.dvc
            run: python3 validation/validate_delhi_2012.py
          - name: odisha
            pull: normalize@odisha
            run: python3 validation/validate_state_survival.py --state odisha
          - name: bihar
            pull: normalize@bihar
            run: python3 validation/validate_state_survival.py --state bihar

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure DVC remote credentials
        run: |
          dvc remote modify origin --local auth basic
          dvc remote modify origin --local user ${{ secrets.DAGSHUB_USERNAME }}
          dvc remote modify origin --local password ${{ secrets.DAGSHUB_TOKEN }}

      - name: Pull only the data this job needs
        run: dvc pull --force ${{ matrix.pull }}

      - name: Run validation
        run: ${{ matrix.run }}
