name: Docker Build & Smoke Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install DVC
        run: pip install dvc

      - name: Configure DVC remote credentials
        run: |
          dvc remote modify origin --local auth basic
          dvc remote modify origin --local user ${{ secrets.DAGSHUB_USERNAME }}
          dvc remote modify origin --local password ${{ secrets.DAGSHUB_TOKEN }}

      - name: Pull the survival model files
        run: dvc pull --force train_odisha train_bihar train_delhi_survival train_delhi_acts

      - name: Build Docker image
        run: docker build -f Dockerfile.api -t case-delay-api .

      - name: Run container
        run: docker run -d -p 8000:8000 --name api-test case-delay-api

      - name: Wait for API to start
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            sleep 2
          done

      - name: Health check
        run: curl -f http://localhost:8000/health

      - name: Smoke test all states
        run: python3 scripts/smoke_test_api.py http://localhost:8000

      - name: Verify audit log write
        run: |
          docker exec api-test python3 -c "import sqlite3; c = sqlite3.connect('audit_log.db'); n = c.execute('SELECT COUNT(*) FROM survival_predictions').fetchone()[0]; print('rows logged:', n); assert n >= 3"

      - name: Show container logs on failure
        if: failure()
        run: docker logs api-test

      - name: Stop container
        if: always()
        run: docker stop api-test

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      RENDER_SERVICE_URL: ${{ secrets.RENDER_SERVICE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install DVC
        run: pip install dvc

      - name: Configure DVC remote credentials
        run: |
          dvc remote modify origin --local auth basic
          dvc remote modify origin --local user ${{ secrets.DAGSHUB_USERNAME }}
          dvc remote modify origin --local password ${{ secrets.DAGSHUB_TOKEN }}

      - name: Pull the survival model files
        run: dvc pull --force train_odisha train_bihar train_delhi_survival train_delhi_acts

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push image
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/case-delay-api
          docker build -f Dockerfile.api -t $IMAGE:latest -t $IMAGE:${{ github.sha }} .
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Trigger Render deploy
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          curl -fsS -G "$RENDER_DEPLOY_HOOK_URL" --data-urlencode "imgURL=${IMAGE}:${{ github.sha }}"
          echo
          sleep 90

      - name: Wait for the live service
        if: env.RENDER_SERVICE_URL != ''
        run: |
          for i in $(seq 1 60); do
            curl -sf --max-time 30 "$RENDER_SERVICE_URL/health" && exit 0
            sleep 10
          done
          echo "Live service was not healthy after 10 minutes"
          exit 1

      - name: Smoke test the live service
        if: env.RENDER_SERVICE_URL != ''
        run: python3 scripts/smoke_test_api.py "$RENDER_SERVICE_URL"
