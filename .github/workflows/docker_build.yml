name: Docker Build & Smoke Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Build Docker image
        run: docker build -f Dockerfile.api -t case-delay-api .

      - name: Run container
        run: docker run -d -p 8000:8000 --name api-test case-delay-api

      - name: Wait for API to start
        run: sleep 5

      - name: Health check
        run: curl -f http://localhost:8000/health

      - name: Smoke test /predict
        run: |
          curl -f -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"type_name_normalized": "hma", "purpose_name_s": "misc", "court_tier": "Principal Judge Family Court", "district_name": "South West", "female_defendant": "0 male", "female_petitioner": "1 female"}'
- name: Verify audit log write
        run: |
          docker exec api-test python3 -c "
          import sqlite3
          conn = sqlite3.connect('audit_log.db')
          count = conn.execute('SELECT COUNT(*) FROM predictions').fetchone()[0]
          print(f'Rows in predictions table: {count}')
          assert count >= 1, 'No prediction was logged to audit_log.db!'
          conn.close()
          "

      - name: Stop container
        if: always()
        run: docker stop api-test



