years: [2010, 2011, 2012, 2013]

states:
  delhi:
    code: "26"
    keep_pending: false      # classifier, pending rows dropped
    normalize: false         # Delhi model uses un-normalized features
  odisha:
    code: "11"
    slug: orissa             # spelling used in the DDL key files and raw filenames
    keep_pending: true       # survival model, pending rows kept as censored
    normalize: true
    top_case_types: 100
    cutoff: "2019-02-28"     # data cutoff for survival censoring
